<!DOCTYPE html>
<html>

<body>
      <h3>SignalR test</h3>
      <div id="log" style="font-family: monospace; white-space: pre-wrap;"></div>

      <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
      <script>
            const token = "PASTE_A_FRESH_JWT_HERE";
            const conversationId = "019f6500-04e3-7c92-8f9a-24dbc1f5f029";
            const log = (msg) => document.getElementById("log").innerText += msg + "\n";

            const connection = new signalR.HubConnectionBuilder()
                  .withUrl("http://localhost:5091/hubs/chat", {
                        accessTokenFactory: () => token
                  })
                  .withAutomaticReconnect()
                  .build();

            connection.on("ReceiveMessage", (message) => {
                  log("RECEIVED: " + JSON.stringify(message));
            });

            connection.onclose((err) => log("CLOSED: " + err));

            connection.start()
                  .then(() => {
                        log("CONNECTED");
                        return connection.invoke("JoinConversation", conversationId);
                  })
                  .then(() => log("JOINED GROUP: " + conversationId))
                  .catch(err => log("ERROR: " + err));
      </script>
</body>

</html>
