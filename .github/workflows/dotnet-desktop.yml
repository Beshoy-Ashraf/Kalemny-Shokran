name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      Solution_Name: KalemnyShokran.slnx
      Test_Project_Path: ""
      Wap_Project_Directory: ""
      Wap_Project_Path: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore "$Solution_Name"

      - name: Build solution
        run: dotnet build "$Solution_Name" --configuration Release --no-restore

      - name: Run tests
        run: dotnet test "$Solution_Name" --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
